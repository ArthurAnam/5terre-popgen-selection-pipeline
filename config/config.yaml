# ============================================================
# Selection / LASSI branch
# ============================================================

selection:
  description: "Haplotype-based selection scan focused on the Cinque Terre population, with selected comparison populations under evaluation."

  primary_focus_dataset: "Cinque Terre"

  scan_design:
    primary_focus: "Cinque Terre"
    comparative_lassi_scans_allowed: true
    notes: "Cinque Terre remains the primary biological focus, but selected external populations may also be scanned or used for comparative interpretation depending on the final analytical design."

  external_populations:
    role: "comparative_scan_or_reference_interpretation"
    italian_wgs_reference_cohorts: "under_evaluation"
    onekg_eur_candidate_populations: ["CEU", "TSI", "IBS"]
    final_comparison_set: ["CEU", "TSI", "IBS"]
    roles:
      CEU: "empirical_LASSI_benchmark_and_Northern_European_reference"
      TSI: "Southern_European_proximate_comparator"
      IBS: "Southern_European_proximate_comparator"
    excluded_from_primary_lassi_comparison: ["FIN", "GBR"]
    ld_context_populations: ["CEU", "FIN", "GBR", "IBS", "TSI"]
    ld_context_only_roles:
      FIN: "European_LD_context_only_not_scanned_with_LASSI"
      GBR: "European_LD_context_only_not_scanned_with_LASSI"

  preprocessing:
    maf_threshold: 0.05
    maf_threshold_status: "frozen_for_lassi_marker_panel_and_ld_window_calibration"
    maf_sensitivity_threshold: 0.01
    ld_pruning: false

  ld_decay:
    purpose: "Estimate linkage-disequilibrium decay separately within CT and all five 1000G EUR populations for complete European LD context; translate decay to SNP-delimited LASSI windows only for CT, CEU, TSI and IBS."
    status: "full_eur_ld_context_completed_lassi_windows_frozen"
    target_dataset: "final_QCed_Cinque_Terre_46_samples"
    statistic: "PLINK1.9 unphased hard-call r2"
    rationale: "LASSI's human empirical protocol calibrated SNP-window size from the physical interval over which r2 decayed below one third of its value at 1 kb. The CT audit first estimates that physical distance, separately from the later conversion to SNP count."
    primary_maf_threshold: 0.05
    sensitivity_maf_threshold: 0.01
    maf_sensitivity_rationale: "Common variants provide a stable primary LD-decay calibration in the 46-sample CT cohort; MAF>=0.01 is retained as a prespecified sensitivity so the 0.05 threshold is not accepted solely by convention."
    full_eur_context_observed:
      CEU: {baseline_mean_r2: 0.41264905618283076, first_crossing_kb: 53.5, stable_crossing_kb: 53.5}
      FIN: {baseline_mean_r2: 0.4129174862827422, first_crossing_kb: 55.5, stable_crossing_kb: 58.5}
      GBR: {baseline_mean_r2: 0.423464777295785, first_crossing_kb: 55.5, stable_crossing_kb: 55.5}
      IBS: {baseline_mean_r2: 0.41134044457191504, first_crossing_kb: 53.5, stable_crossing_kb: 53.5}
      TSI: {baseline_mean_r2: 0.40857039026268993, first_crossing_kb: 52.5, stable_crossing_kb: 52.5}
      CT: {baseline_mean_r2: 0.4144855994950274, first_crossing_kb: 55.5, stable_crossing_kb: 57.5}
      interpretation: "Across CT and all five 1000G EUR populations, the selected physical LD-decay scale is tightly clustered between 52.5 and 55.5 kb. FIN has a later five-bin stable crossing at 58.5 kb, but its direct first crossing is still 55.5 kb."
    anchor_sampling:
      method: "deterministic_even_physical_spacing"
      anchors_per_chromosome: 100
      edge_margin_kb: 500
      max_pair_distance_kb: 500
      rationale: "Use a physically distributed anchor subset to avoid an infeasible all-pairs calculation on WGS-density data while retaining genome-wide representation. Every anchor is compared with all eligible nearby SNPs."
    bin_width_kb: 1
    baseline_distance_kb: 1
    baseline_half_width_kb: 0.5
    decay_fraction: 0.3333333333
    crossing_definition: "first 1-kb distance bin beyond the baseline interval whose mean r2 is below one third of the mean r2 for pairs separated by 0.5-1.5 kb"
    stability_diagnostic_consecutive_bins: 5
    observed_audit:
      maf0.05:
        total_valid_ld_pairs: 4033512
        baseline_pair_count: 7603
        baseline_mean_r2: 0.4144855994950274
        one_third_threshold_r2: 0.13816186648452627
        first_crossing_kb: 55.5
        stable_5bin_crossing_kb: 57.5
      maf0.01_sensitivity:
        total_valid_ld_pairs: 7272074
        baseline_pair_count: 14365
        baseline_mean_r2: 0.186481064711031
        one_third_threshold_r2: 0.06216035489746097
        first_crossing_kb: 63.5
        stable_5bin_crossing_kb: 67.5
      interpretation: "The lower-MAF sensitivity shifts the absolute crossing modestly but leaves the physical LD scale in the same tens-of-kb range. Because the LASSI marker panel is MAF>=0.05, its LD decay is the primary calibration."
    derived_parameters:
      selected_physical_decay_kb: 55.5
      selected_physical_decay_definition: "first 1-kb bin below one third of the 0.5-1.5-kb baseline mean r2"
      stable_diagnostic_kb: 57.5
      physical_decay_kb_maf0.05: 55.5
      physical_decay_kb_maf0.01: 63.5
      lassi_window_snps: null
      lassi_shift_snps: null
      shift_fraction_of_window: 0.10
    next_decision: "Full MAF>=0.05 LD context is complete for CT plus all five 1000G EUR populations. Proceed to CT phasing and LASSI input preparation; FIN and GBR remain LD-context-only populations unless the scan design changes."

  phasing:
    method: "SHAPEIT5 phase_common"
    software_version_target: "5.1.1"
    status: "reference_overlap_preflight_next"
    purpose: "Phase Cinque Terre common SNPs for haplotype-based LASSI; CEU, TSI and IBS use the already phased 1000 Genomes Phase 3 haplotypes."
    marker_panel:
      target_population: "CT"
      maf_threshold: 0.05
      variant_type: "biallelic SNPs"
      rationale: "Phase the same common-variant scale used by the production CT LASSI scan."
    reference_support:
      candidate_full_1kg_phase3: "audit_exact_overlap_before_use"
      candidate_1kg_eur: "audit_exact_overlap_before_use"
      selected_scope: null
      additional_italian_wgs_cohorts: "not_required_for_current_preflight"
      caution: "SHAPEIT5 --reference ignores input sites absent from the reference panel; marker retention must therefore be quantified before production phasing."
    provisional_strategy:
      stage1: "reference-assisted phase_common on exact target-reference overlap"
      stage2: "phase the complete CT MAF>=0.05 panel using the stage1 CT haplotypes as a scaffold, if the overlap audit supports this design"
      rationale: "Use external reference information without silently discarding CT common SNPs that are absent from the reference."
    independent_from_ld_decay: true
    population_handling:
      CT: "requires phasing"
      CEU: "use published 1000 Genomes Phase 3 phased haplotypes"
      TSI: "use published 1000 Genomes Phase 3 phased haplotypes"
      IBS: "use published 1000 Genomes Phase 3 phased haplotypes"
    genetic_map:
      build: "GRCh37/b37"
      source: "SHAPEIT5 distributed genetic maps"
      local_directory_key: "local_paths.shapeit5_b37_map_dir"
      required_for_production_phasing: true
    seed: 15052011
    parameters_to_refine:
      reference_scope: "full_1kg_vs_eur_pending_overlap_audit"
      whole_chromosome_vs_chunking: "pending_after_preflight"
      effective_population_size: "SHAPEIT5 default unless justified otherwise"
      mcmc_or_pbwt_tuning: "use SHAPEIT5 defaults unless diagnostics indicate a need to change"

  lassi:
    method: "LASSI"
    purpose: "Likelihood-based identification of candidate genomic regions deviating from neutral expectations."
    window_definition: "derived_from_ld_decay"
    scan_mode: "sliding_likelihood_window"

    likelihood_window_snps: "population_specific; CT=99, CEU=116, TSI=112, IBS=116"
    likelihood_shift_snps: "population_specific; CT=10, CEU=12, TSI=11, IBS=12"
    window_parameter_units: "SNP count, not kb"
    window_calibration:
      strategy: "population_specific"
      status: "completed_and_frozen"
      populations: ["CT", "CEU", "TSI", "IBS"]
      principle: "Each population receives its own MAF>=0.05 LD-decay estimate and its own SNP-delimited winsize/winstep; no common window is imposed across populations."
      step_rule: "round 10% of each population-specific winsize to nearest integer, minimum 1 SNP"
      CT:
        role: "focal_discovery_population"
        physical_scale_kb: 55.5
        stable_physical_scale_kb: 57.5
        baseline_mean_r2: 0.4144855994950274
        one_third_threshold_r2: 0.13816186648452627
        n_anchors: 2200
        median_snps_primary: 99.0
        q1_snps_primary: 68.0
        q3_snps_primary: 136.0
        median_snps_stable: 103.0
        selected_winsize_snps: 99
        selected_winstep_snps: 10
        status: "frozen"
      CEU:
        role: "empirical_LASSI_benchmark"
        physical_scale_kb: 53.5
        stable_physical_scale_kb: 53.5
        baseline_mean_r2: 0.41264905618283076
        one_third_threshold_r2: 0.13754968538052195
        n_anchors: 2200
        median_snps_primary: 116.0
        q1_snps_primary: 78.75
        q3_snps_primary: 156.0
        selected_winsize_snps: 116
        selected_winstep_snps: 12
        status: "frozen"
      TSI:
        role: "Southern_European_proximate_comparator"
        physical_scale_kb: 52.5
        stable_physical_scale_kb: 52.5
        baseline_mean_r2: 0.40857039026268993
        one_third_threshold_r2: 0.1361901300739443
        n_anchors: 2200
        median_snps_primary: 112.0
        q1_snps_primary: 77.0
        q3_snps_primary: 154.0
        selected_winsize_snps: 112
        selected_winstep_snps: 11
        status: "frozen"
      IBS:
        role: "Southern_European_proximate_comparator"
        physical_scale_kb: 53.5
        stable_physical_scale_kb: 53.5
        baseline_mean_r2: 0.41134044457191504
        one_third_threshold_r2: 0.13711348151026032
        n_anchors: 2200
        median_snps_primary: 116.0
        q1_snps_primary: 78.75
        q3_snps_primary: 156.0
        selected_winsize_snps: 116
        selected_winstep_snps: 12
        status: "frozen"
      interpretation: "Physical LD decay is highly similar across the four populations (52.5-55.5 kb), but the SNP count representing that physical scale differs because population-specific MAF>=0.05 panels have different marker densities. Population-specific winsizes are therefore retained."
    parameters_to_refine:
      grid_size: null
      selection_model: null


# ============================================================
# Post-LASSI processing and candidate region definition
# ============================================================

lassi_postprocessing:
  description: "Post-processing, ranking, and annotation of candidate genomic regions."

  primary_output: "candidate_regions_deviating_from_neutrality"

  candidate_region_definition:
    allow_single_high_scoring_windows: true
    allow_merged_nearby_windows: true
    maximum_distance_kb_for_merging: null
    compute_genomic_span_post_hoc: true
    notes: "LASSI does not directly provide candidate-region span in kb; genomic span must be computed from window coordinates."

  ranking:
    enabled: true
    criteria:
      - "maximum LASSI score"
      - "mean LASSI score"
      - "local signal coherence"
      - "genomic span"
      - "functional genomic context"

  m_parameter_interpretation:
    enabled: true
    role: "secondary_interpretation_only"
    hard_sweep: "m = 1"
    soft_sweep: "m > 1"

  mappability_filtering:
    enabled: false
    status: "secondary_or_sensitivity_filter_if_used"
    candidate_metric: "mean CRG100 score"
    candidate_threshold: 0.9


# ============================================================
# Functional interpretation
# ============================================================

functional_interpretation:
  description: "Exploratory biological contextualization of candidate genomic regions."

  functional_genomic_context:
    - "coding regions"
    - "regulatory regions"
    - "intergenic regions"

  exploratory_methods_under_evaluation:
    - "ORA"
    - "GSEA"

  interpretation_role: "hypothesis_generation_only"
  not_independent_validation_of_selection: true


# ============================================================
# Optional demographic branch: IBD / IBDNe
# ============================================================

demography:
  enabled: false
  description: "Optional branch for recent demographic history inference."

  generation_time:
    years: 29
    reference: "Fenner 2005"

  input_requirement:
    phased_data: true
    ibd_segments: true

  ibd_detection:
    enabled: false
    purpose: "Detect IBD segments between individuals."
    tool: null
    candidate_tools:
      - "hap-IBD"
      - "Refined IBD"

  ibdne:
    enabled: false
    tool: "IBDNe"
    purpose: "Estimate recent effective population size over time from IBD segments."

    input:
      phased_data: "from_phasing_branch_if_available"
      ibd_segments: "from_ibd_detection"

    output:
      - "Ne_over_time"
      - "generation_time_series"

    summary:
      use_harmonic_mean: true
      mean_generations: 50


# ============================================================
# Output folders
# ============================================================

output:
  results_dir: "results"
  logs_dir: "logs"
  benchmark_dir: "benchmarks"


# ============================================================
# Individual pre-QC
# ============================================================

sample_preqc:
  description: "Diagnostic sample-level QC on the delivered 50-sample post-VQSR VCF; flags require review and never trigger automatic exclusion."
  scope: "autosomes_1_22"
  automatic_sample_exclusion: false
  robust_z_threshold: 3.5
