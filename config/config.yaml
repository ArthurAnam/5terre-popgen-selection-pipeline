  lassi:
    method: "saltiLASSI"
    statistic: "Lambda"
    purpose: "Primary spatially aware likelihood scan for selective-sweep candidates from phased haplotype-frequency spectra; original LASSI T is retained as a secondary benchmark."
    scan_mode: "spatial_composite_likelihood"
    implementation:
      program: "lassip"
      version: "1.2.1"
      commit: "a6a9d18c2323330fbf74d5a490f9e9c4ebe41d7c"
      primary_mode_flag: "--salti"
