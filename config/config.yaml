# ============================================================
# Cinque Terre population genomics and selection pipeline
# Global configuration
# ============================================================

project:
  name: "Cinque Terre population genomics and selection pipeline"
  workflow_manager: "Snakemake"
  genome_build: "GRCh37.p13"
  genome_alias: "hg19"


# ============================================================
# Variant representation and coordinate conventions
# ============================================================

variant_representation:
  coordinate_system: "VCF 1-based"
  chromosome_naming: "numeric"
  allowed_chromosomes: "1-22"
  variant_id_format: "CHR:POS:REF:ALT"
  reference_build: "GRCh37.p13"
  reference_alias: "hg19"


# ============================================================
# Datasets
# ============================================================

datasets:
  target:
    name: "Cinque Terre"
    role: "target_population"
    description: "Target population under study"
    data_type: "WGS"
    input_sample_count: 50
    expected_post_qc_sample_count: null
    historical_post_qc_sample_count_to_verify: 46
    mean_depth: "approximately 30x"
    vcf: null
    upstream_processing:
      variants_called: true
      vqsr_filtered: true
      non_passing_vqsr_variants_removed: true
      notes: "Variant calling and VQSR were performed upstream. The delivered VCF is reported to contain only variants that passed Variant Recalibration; this is verified during pre-QC and is not repeated as a filtering step."

  italian_wgs_reference_cohorts:
    enabled: true
    status: "under_evaluation"
    role: "primary_comparative_framework"
    description: "Italian WGS reference cohorts to be used as the main comparative framework, ideally representing North and South Italy."
    candidate_source: "Sazzini et al. 2020"
    candidate_groups:
      - "North Italy"
      - "South Italy"
    vcf: null
    upstream_processing:
      original_published_qc: true
      notes: "External Italian WGS reference cohorts are assumed to rely on their original published QC procedures."

  reference_1kg_eur:
    enabled: true
    name: "1000 Genomes Project EUR"
    role: "European_reference_context_and_phasing_support"
    description: "European reference populations from the 1000 Genomes Project."
    vcf: null
    populations:
      all_eur: ["CEU", "FIN", "GBR", "IBS", "TSI"]
      expected_counts:
        CEU: 99
        FIN: 99
        GBR: 91
        IBS: 107
        TSI: 107
      expected_total_eur_samples: 503
      selection_comparison_candidates: ["TSI", "FIN", "IBS"]
    assumed_phased: true
    phase3_vcf_filename_template: "ALL.chr{chrom}.phase3_shapeit2_mvncall_integrated_v5b.20130502.genotypes.vcf.gz"
    upstream_processing:
      original_published_qc: true
      notes: "The 1000 Genomes EUR panel is used as European reference context and phasing support; only selected populations may be retained for selection-related comparison."
    downstream_qc:
      scope: "503-sample EUR subset"
      retain_biallelic_snps_only: true
      remove_monomorphic_after_subset: true
      remove_variants_with_missingness_gt: 0.05
      remove_individuals_with_missingness_gt: 0.05
      iterate_until_stable_if_sample_removed: true
      pooled_eur_hwe_filter: false
      hwe_exploration_by_population: true
      hwe_exploration_populations: ["CEU", "FIN", "GBR", "IBS", "TSI"]
      genomewide_audit:
        biallelic_snps: 77818346
        monomorphic_in_eur: 55685456
        sites_with_any_missingness: 0
        sites_with_missingness_gt_0_05: 0
        retained_polymorphic_biallelic_snps_pre_palindromic_filter: 22132890
        palindromic_snps_removed: 3381797
        harmonization_ready_nonpalindromic_snps: 18751093
      notes: "HWE is exploratory only for 1000G EUR and is evaluated separately by population; it is not used as a filtering criterion."
    harmonization:
      exact_match_key: "CHR:POS:REF:ALT"
      exact_allele_match_only: true
      strand_flip_or_allele_rescue: false
      observed_audit:
        target_qc_snps: 9000246
        eur_qc_records_nonpalindromic: 18751093
        eur_qc_unique_exact_keys: 18751091
        shared_positions: 7551493
        exact_matches: 7548844
        same_position_allele_mismatches: 2649


# ============================================================
# General variant-level and sample-level filtering
# ============================================================

qc:
  description: "Common population-genomics filtering applied before downstream branch-specific analyses."

  upstream_quality_assumptions:
    target_vqsr_already_applied: true
    external_datasets_use_original_published_qc: true
    repeat_variant_calling_or_vqsr: false
    repeat_depth_or_genotype_quality_filtering_by_default: false

  variant_filters:
    remove_non_autosomal: true
    remove_non_snp: true
    remove_multiallelic: true
    remove_monomorphic: true
    remove_strand_ambiguous: true
    strand_ambiguous_classes: ["A/T", "C/G"]
    strand_ambiguous_role: "core_target_qc_and_harmonization_control"

  missingness:
    remove_variants_with_missingness_gt: 0.05
    remove_individuals_with_missingness_gt: 0.05
    iterate_until_stable: true
    convergence_definition: "repeat cohort-dependent site QC after any sample removal; stop when no additional individual is removed"

  hwe:
    apply: true
    alpha: 0.05
    correction: "bonferroni"
    by_chromosome: true
    threshold_definition: "0.05 / number_of_tested_variants_on_each_chromosome"
    scope: "computed separately for each chromosome"
    notes: "The HWE threshold is not a fixed genome-wide value; it is recalculated chromosome by chromosome according to the number of tested variants."

  output_dataset: "QC_FILTERED"


# ============================================================
# IBS / relatedness exploration
# ============================================================

relatedness:
  description: "Pairwise KING relatedness analysis within the Cinque Terre target cohort, with a secondary QC role."

  primary_role: "population_structure_and_relatedness_exploration"
  secondary_qc_role: "check_for_unexpected_duplicates_or_close_relatives"
  assumption: "Datasets are expected to be composed of unrelated individuals, but this assumption should be checked."
  automatic_sample_exclusion: false

  king:
    tool: "KING"
    estimator: "KING-robust"
    command_mode: "--kinship"
    input_dataset: "stable pre-HWE target QC autosomal biallelic SNP set"
    purpose: "Pairwise relatedness estimation within Cinque Terre."
    ld_pruning: false
    maf_filter: false
    thresholds:
      duplicate_or_MZ_gt: 0.354
      first_degree_min: 0.177
      second_degree_min: 0.0884
      third_degree_min: 0.0442
    notes: "No individual is removed automatically. KING is run before HWE filtering, without MAF filtering or LD pruning. With --kinship, duplicate/first-/second-degree calls are the primary relationship screen; the 0.0442 third-degree threshold is exploratory only."

# ============================================================
# Population structure branch
# ============================================================

population_structure:
  description: "Analyses aimed at describing genetic structure, relatedness, and autozygosity in the Cinque Terre population within an Italian and European context."

  target_dataset: "Cinque Terre"

  main_comparative_framework:
    - "North Italy WGS reference cohort"
    - "South Italy WGS reference cohort"

  secondary_reference_context:
    - "1000 Genomes Project EUR"

  harmonize_datasets: true

  analyses:
    pca: true
    roh: true
    froh: true
    roh_sum: true
    roh_length_distribution: true
    king_kinship_and_ibs0: true

  excluded_analyses:
    admixture: true
    fst: true
    ancestry_proportions: true
    population_grouping_inference: true

  pca:
    method: "smartpca"
    purpose: "Ancestry placement and fine-scale population structure."
    parameter_status: "joint_pca_preprocessing_fixed_smartpca_execution_pending"
    analysis_mode: "joint"
    expected_joint_samples: 549
    expected_harmonized_variants: 7548844
    maf_threshold: 0.05
    maf_scope: "joint_harmonized_ct_plus_1kg_eur"
    filter_order: ["maf", "ld_pruning"]
    ld_pruning: true
    ld_pruning_scope: "joint_harmonized_ct_plus_1kg_eur"
    pruning:
      tool: "PLINK2 --indep-pairwise"
      window_snps: 50
      step_snps: 5
      r2_threshold: 0.2
      indep_order: 1
      rationale: "Match the 50-SNV, 5-SNV-step, r2>0.2 strategy used by Sazzini et al. 2020; PLINK2 --indep-order 1 is set explicitly to reproduce PLINK 1.x pruning order rather than the newer PLINK2 default."
    observed_unmasked_preprocessing:
      harmonized_input_variants: 7548844
      harmonized_input_samples: 549
      variants_after_maf: 4878327
      variants_removed_by_maf: 2670517
      variants_removed_by_ld_pruning: 4582952
      variants_after_ld_pruning: 295375
      pca_preprocessed_samples: 549
      pca_preprocessed_variants: 295375
    high_ld_sensitivity:
      enabled: true
      run_both_masked_and_unmasked: true
      presentation_status: "pending_comparison"
      region_file: "config/pca_high_ld_regions_grch37.bed1"
      region_build: "GRCh37"
      region_count: 18
      region_catalog_source: "Grinde et al. 2024 literature-review catalog, build-37 file"
      masked_filter_order: ["maf", "predefined_high_ld_mask", "ld_pruning"]
      rationale: "Run an otherwise identical PCA-preprocessing sensitivity branch with a predefined GRCh37 high-LD mask; do not select regions from the observed Cinque Terre PCA."
    n_components: null

  roh:
    method: "PLINK --homozyg"
    purpose: "Runs of homozygosity burden, segment length distribution, and autozygosity."
    parameter_status: "pending_documentation_review"
    maf_threshold: null
    ld_pruning: null
    pruning: null

    parameters_to_refine:
      homozyg_snp: null
      homozyg_kb: null
      homozyg_density: null
      homozyg_gap: null


# ============================================================
# Selection / LASSI branch
# ============================================================

selection:
  description: "Haplotype-based selection scan focused on the Cinque Terre population, with selected comparison populations under evaluation."

  primary_focus_dataset: "Cinque Terre"

  scan_design:
    primary_focus: "Cinque Terre"
    comparative_lassi_scans_allowed: true
    notes: "Cinque Terre remains the primary biological focus, but selected external populations may also be scanned or used for comparative interpretation depending on the final analytical design."

  external_populations:
    role: "comparative_scan_or_reference_interpretation"
    italian_wgs_reference_cohorts: "under_evaluation"
    onekg_eur_candidate_populations: ["TSI", "FIN", "IBS"]
    final_comparison_set: "to_be_defined"

  preprocessing:
    maf_threshold: 0.05
    ld_pruning: false

  ld_decay:
    purpose: "Estimate LD decay and derive LASSI window-size parameters."
    baseline_distance_kb: 1
    decay_fraction: 0.3333333333

    derived_parameters:
      lassi_window_snps: null
      lassi_shift_snps: null
      shift_fraction_of_window: 0.10

  phasing:
    method: "SHAPEIT2"
    purpose: "Phase target and selected comparison datasets using suitable phased reference haplotypes."
    reference_support:
      primary: "1000 Genomes Project EUR"
      additional_italian_wgs_cohorts: "under_evaluation"
    independent_from_ld_decay: true
    genetic_map: null

    parameters_to_refine:
      effective_population_size: null
      burn_in: null
      pruning: null
      main_iterations: null

  lassi:
    method: "LASSI"
    purpose: "Likelihood-based identification of candidate genomic regions deviating from neutral expectations."
    window_definition: "derived_from_ld_decay"
    scan_mode: "sliding_likelihood_window"

    likelihood_window_snps: null
    likelihood_shift_snps: null

    parameters_to_refine:
      grid_size: null
      selection_model: null


# ============================================================
# Post-LASSI processing and candidate region definition
# ============================================================

lassi_postprocessing:
  description: "Post-processing, ranking, and annotation of candidate genomic regions."

  primary_output: "candidate_regions_deviating_from_neutrality"

  candidate_region_definition:
    allow_single_high_scoring_windows: true
    allow_merged_nearby_windows: true
    maximum_distance_kb_for_merging: null
    compute_genomic_span_post_hoc: true
    notes: "LASSI does not directly provide candidate-region span in kb; genomic span must be computed from window coordinates."

  ranking:
    enabled: true
    criteria:
      - "maximum LASSI score"
      - "mean LASSI score"
      - "local signal coherence"
      - "genomic span"
      - "functional genomic context"

  m_parameter_interpretation:
    enabled: true
    role: "secondary_interpretation_only"
    hard_sweep: "m = 1"
    soft_sweep: "m > 1"

  mappability_filtering:
    enabled: false
    status: "secondary_or_sensitivity_filter_if_used"
    candidate_metric: "mean CRG100 score"
    candidate_threshold: 0.9


# ============================================================
# Functional interpretation
# ============================================================

functional_interpretation:
  description: "Exploratory biological contextualization of candidate genomic regions."

  functional_genomic_context:
    - "coding regions"
    - "regulatory regions"
    - "intergenic regions"

  exploratory_methods_under_evaluation:
    - "ORA"
    - "GSEA"

  interpretation_role: "hypothesis_generation_only"
  not_independent_validation_of_selection: true


# ============================================================
# Optional demographic branch: IBD / IBDNe
# ============================================================

demography:
  enabled: false
  description: "Optional branch for recent demographic history inference."

  generation_time:
    years: 29
    reference: "Fenner 2005"

  input_requirement:
    phased_data: true
    ibd_segments: true

  ibd_detection:
    enabled: false
    purpose: "Detect IBD segments between individuals."
    tool: null
    candidate_tools:
      - "hap-IBD"
      - "Refined IBD"

  ibdne:
    enabled: false
    tool: "IBDNe"
    purpose: "Estimate recent effective population size over time from IBD segments."

    input:
      phased_data: "from_phasing_branch_if_available"
      ibd_segments: "from_ibd_detection"

    output:
      - "Ne_over_time"
      - "generation_time_series"

    summary:
      use_harmonic_mean: true
      mean_generations: 50


# ============================================================
# Output folders
# ============================================================

output:
  results_dir: "results"
  logs_dir: "logs"
  benchmark_dir: "benchmarks"


# ============================================================
# Individual pre-QC
# ============================================================

sample_preqc:
  description: "Diagnostic sample-level QC on the delivered 50-sample post-VQSR VCF; flags require review and never trigger automatic exclusion."
  scope: "autosomes_1_22"
  automatic_sample_exclusion: false
  robust_z_threshold: 3.5
