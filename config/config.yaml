      status: "pending_final_refreeze_after_exact_marker_panel_audits"
      salti_step_strategy: "approximately 50% of winsize"
      salti_step_fraction: 0.5
      salti_step_rationale: "The empirical human saltiLASSI application used winsize=201 and winstep=100. The approximately 50% overlap is transferred proportionally; this is a study design choice, not a universal recommendation."
      CT:
        physical_ld_scale_kb: 55.5
        prephasing_winsize_snps: 99
        prephasing_winstep_snps: 50
        exact_phased_sites: 4914283
        exact_phased_winsize_candidate_snps: 97
        exact_phased_winstep_candidate_snps: 49
        production_status: "candidate_pending_formal_refreeze"
      CEU:
        previous_pre_nonpal_winsize_snps: 116
        previous_pre_nonpal_winstep_snps: 58
        production_status: "pending_recalibration_after_AT_CG_exclusion"
      TSI:
        previous_pre_nonpal_winsize_snps: 112
        previous_pre_nonpal_winstep_snps: 56
        production_status: "pending_recalibration_after_AT_CG_exclusion"
      IBS:
        previous_pre_nonpal_winsize_snps: 116
        previous_pre_nonpal_winstep_snps: 58
        production_status: "pending_recalibration_after_AT_CG_exclusion"
    ld_calibration:
      primary_definition: "first 1-kb bin whose mean r2 is below one third of the mean r2 for SNP pairs separated by 0.5-1.5 kb"
      formula: "d_LD,p = min{d: mean_r2_p(d) < (1/3) * mean_r2_p(1kb)}"
      stable_crossing_role: "robustness diagnostic only; first bin initiating five consecutive below-threshold bins"
      stable_crossing_not_used_for_window: true
      full_eur_context: ["CT", "CEU", "FIN", "GBR", "IBS", "TSI"]
    mappability:
      required: true
      metric: "CRG100 / wgEncodeCrgMapabilityAlign100mer"
      genome_build: "GRCh37/hg19"
      threshold: 0.9
      local_resource_key: "local_paths.crg100_bigwig"
      source: "UCSC ENCODE Mappability track"
      source_url: "https://hgdownload.soe.ucsc.edu/goldenPath/hg19/encodeDCC/wgEncodeMapability/wgEncodeCrgMapabilityAlign100mer.bigWig"
      expected_filename: "wgEncodeCrgMapabilityAlign100mer.bigWig"
      expected_md5: "a1b1a8c99431fedf6a3b4baef028cca4"
      ucsc_accession: "wgEncodeEH000317"
    inference:
      CT:
        threshold_framework: "empirical_outlier"
        primary_candidate_threshold: "top 1% genome-wide Lambda"
        descriptive_thresholds: ["top 0.1%", "top 5%"]
        merge_rule: "concatenate consecutive windows exceeding the top-1% threshold"
        terminology: "candidate/outlier regions; do not call simulated-demography significance"
      comparators:
        populations: ["CEU", "TSI", "IBS"]
        threshold_framework: "population-specific empirical ranking"
        note: "No cross-population comparison of absolute Lambda values or shared numeric thresholds."
      recombination_caution: "Annotate strong candidates in low-recombination regions and interpret them with extra scrutiny because Lambda is a composite likelihood that ignores recombination."
    secondary_lassi_T:
      enabled: true
      role: "methodological benchmark and continuity with Harris & DeGiorgio 2020"
      model_D_choice: 4
      K: 10
      population_specific_windows:
        CT: {winsize_snps: 99, winstep_snps: 10}
        CEU: {winsize_snps: 116, winstep_snps: 12}
        TSI: {winsize_snps: 112, winstep_snps: 11}
        IBS: {winsize_snps: 116, winstep_snps: 12}
      CEU_benchmark_note: "The independently calibrated CEU 116/12 window is close to the published 117/12 human LASSI scan and supports qualitative locus/ranking comparison. It is not an exact score replication because this study uses MAF>=0.05 ascertainment."
    software_preflight:
      required: true
      expected_version: "1.2.1"
      expected_commit: "a6a9d18c2323330fbf74d5a490f9e9c4ebe41d7c"
      expected_repository: "szpiech/lassip"
      gate_target: "gate_selection_lassip_software"
    parameters_to_refine:
      remaining:
        - "production phased-VCF generation and exact marker/missingness audit"
        - "single CT chr20 runtime/RAM/output-size benchmark for the frozen saltiLASSI setting"


# ============================================================
# Post-LASSI processing and candidate region definition
# ============================================================

lassi_postprocessing:
  description: "Post-processing, ranking, and annotation of candidate genomic regions."

  primary_output: "saltiLASSI_candidate_outlier_regions"

  candidate_region_definition:
    allow_single_high_scoring_windows: true
    allow_merged_nearby_windows: true
    maximum_distance_kb_for_merging: null
    compute_genomic_span_post_hoc: true
    notes: "LASSI does not directly provide candidate-region span in kb; genomic span must be computed from window coordinates."

  ranking:
    enabled: true
    criteria:
      - "maximum saltiLASSI Lambda"
      - "mean saltiLASSI Lambda"
      - "local signal coherence"
      - "genomic span"
      - "functional genomic context"

  m_parameter_interpretation:
    enabled: true
    role: "secondary_interpretation_only"
    hard_sweep: "m = 1"
    soft_sweep: "m > 1"

  mappability_filtering:
    enabled: true
    status: "required_preproduction_filter"
    candidate_metric: "mean CRG100 score"
    candidate_threshold: 0.9
    genome_build: "GRCh37/hg19"
    local_resource_key: "local_paths.crg100_bigwig"


# ============================================================
# Functional interpretation
# ============================================================

functional_interpretation:
  description: "Exploratory biological contextualization of candidate genomic regions."

  functional_genomic_context:
    - "coding regions"
    - "regulatory regions"
    - "intergenic regions"

  exploratory_methods_under_evaluation:
    - "ORA"
    - "GSEA"

  interpretation_role: "hypothesis_generation_only"
  not_independent_validation_of_selection: true


# ============================================================
# Optional demographic branch: IBD / IBDNe
# ============================================================

demography:
  enabled: false
  description: "Optional branch for recent demographic history inference."

  generation_time:
    years: 29
    reference: "Fenner 2005"

  input_requirement:
    phased_data: true
    ibd_segments: true

  ibd_detection:
    enabled: false
    purpose: "Detect IBD segments between individuals."
    tool: null
    candidate_tools:
      - "hap-IBD"
      - "Refined IBD"

  ibdne:
    enabled: false
    tool: "IBDNe"
    purpose: "Estimate recent effective population size over time from IBD segments."

    input:
      phased_data: "from_phasing_branch_if_available"
      ibd_segments: "from_ibd_detection"

    output:
      - "Ne_over_time"
      - "generation_time_series"

    summary:
      use_harmonic_mean: true
      mean_generations: 50


# ============================================================
# Output folders
# ============================================================

output:
  results_dir: "results"
  logs_dir: "logs"
  benchmark_dir: "benchmarks"


# ============================================================
# Individual pre-QC
# ============================================================

sample_preqc:
  description: "Diagnostic sample-level QC on the delivered 50-sample post-VQSR VCF; flags require review and never trigger automatic exclusion."
  scope: "autosomes_1_22"
  automatic_sample_exclusion: false
  robust_z_threshold: 3.5
