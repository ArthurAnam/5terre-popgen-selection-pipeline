# ============================================================
# Cinque Terre population genomics and selection pipeline
# Global configuration
# ============================================================

project:
  name: "Cinque Terre population genomics and selection pipeline"
  workflow_manager: "Snakemake"
  genome_build: "GRCh37.p13"
  genome_alias: "hg19"


# ============================================================
# Variant representation and coordinate conventions
# ============================================================

variant_representation:
  coordinate_system: "VCF 1-based"
  chromosome_naming: "numeric"
  allowed_chromosomes: "1-22"
  variant_id_format: "CHR:POS:REF:ALT"
  reference_build: "GRCh37.p13"
  reference_alias: "hg19"


# ============================================================
# Datasets
# ============================================================

datasets:
  target:
    name: "Cinque Terre"
    role: "target_population"
    description: "Target population under study"
    data_type: "WGS"
    input_sample_count: 50
    expected_post_qc_sample_count: 46
    historical_post_qc_sample_count_to_verify: 46
    verified_post_qc_sample_count: 46
    mean_depth: "approximately 30x"
    vcf: null
    upstream_processing:
      variants_called: true
      vqsr_filtered: true
      non_passing_vqsr_variants_removed: true
      notes: "Variant calling and VQSR were performed upstream. The delivered VCF is reported to contain only variants that passed Variant Recalibration; this is verified during pre-QC and is not repeated as a filtering step."

  italian_wgs_reference_cohorts:
    enabled: true
    status: "under_evaluation"
    role: "primary_comparative_framework"
    description: "Italian WGS reference cohorts to be used as the main comparative framework, ideally representing North and South Italy."
    candidate_source: "Sazzini et al. 2020"
    candidate_groups:
      - "North Italy"
      - "South Italy"
    vcf: null
    upstream_processing:
      original_published_qc: true
      notes: "External Italian WGS reference cohorts are assumed to rely on their original published QC procedures."

  reference_1kg_eur:
    enabled: true
    name: "1000 Genomes Project EUR"
    role: "European_reference_context_and_phasing_support"
    description: "European reference populations from the 1000 Genomes Project."
    vcf: null
    populations:
      all_eur: ["CEU", "FIN", "GBR", "IBS", "TSI"]
      expected_counts:
        CEU: 99
        FIN: 99
        GBR: 91
        IBS: 107
        TSI: 107
      expected_total_eur_samples: 503
      selection_comparison_candidates: ["CEU", "TSI", "IBS"]
    assumed_phased: true
    phase3_vcf_filename_template: "ALL.chr{chrom}.phase3_shapeit2_mvncall_integrated_v5b.20130502.genotypes.vcf.gz"
    upstream_processing:
      original_published_qc: true
      notes: "The 1000 Genomes EUR panel is used as European reference context and phasing support; only selected populations may be retained for selection-related comparison."
    downstream_qc:
      scope: "503-sample EUR subset"
      retain_biallelic_snps_only: true
      remove_monomorphic_after_subset: true
      remove_variants_with_missingness_gt: 0.05
      remove_individuals_with_missingness_gt: 0.05
      iterate_until_stable_if_sample_removed: true
      pooled_eur_hwe_filter: false
      hwe_exploration_by_population: true
      hwe_exploration_populations: ["CEU", "FIN", "GBR", "IBS", "TSI"]
      genomewide_audit:
        biallelic_snps: 77818346
        monomorphic_in_eur: 55685456
        sites_with_any_missingness: 0
        sites_with_missingness_gt_0_05: 0
        retained_polymorphic_biallelic_snps_pre_palindromic_filter: 22132890
        palindromic_snps_removed: 3381797
        harmonization_ready_nonpalindromic_snps: 18751093
      notes: "HWE is exploratory only for 1000G EUR and is evaluated separately by population; it is not used as a filtering criterion."
    harmonization:
      exact_match_key: "CHR:POS:REF:ALT"
      exact_allele_match_only: true
      strand_flip_or_allele_rescue: false
      observed_audit:
        target_qc_snps: 9000246
        eur_qc_records_nonpalindromic: 18751093
        eur_qc_unique_exact_keys: 18751091
        shared_positions: 7551493
        exact_matches: 7548844
        same_position_allele_mismatches: 2649


# ============================================================
# General variant-level and sample-level filtering
# ============================================================

qc:
  description: "Common population-genomics filtering applied before downstream branch-specific analyses."

  upstream_quality_assumptions:
    target_vqsr_already_applied: true
    external_datasets_use_original_published_qc: true
    repeat_variant_calling_or_vqsr: false
    repeat_depth_or_genotype_quality_filtering_by_default: false

  variant_filters:
    remove_non_autosomal: true
    remove_non_snp: true
    remove_multiallelic: true
    remove_monomorphic: true
    remove_strand_ambiguous: true
    strand_ambiguous_classes: ["A/T", "C/G"]
    strand_ambiguous_role: "core_target_qc_and_harmonization_control"

  missingness:
    remove_variants_with_missingness_gt: 0.05
    remove_individuals_with_missingness_gt: 0.05
    iterate_until_stable: true
    convergence_definition: "repeat cohort-dependent site QC after any sample removal; stop when no additional individual is removed"

  hwe:
    apply: true
    alpha: 0.05
    correction: "bonferroni"
    by_chromosome: true
    threshold_definition: "0.05 / number_of_tested_variants_on_each_chromosome"
    scope: "computed separately for each chromosome"
    notes: "The HWE threshold is not a fixed genome-wide value; it is recalculated chromosome by chromosome according to the number of tested variants."

  output_dataset: "QC_FILTERED"


# ============================================================
# IBS / relatedness exploration
# ============================================================

relatedness:
  description: "Pairwise KING relatedness analysis within the Cinque Terre target cohort, with a secondary QC role."

  primary_role: "population_structure_and_relatedness_exploration"
  secondary_qc_role: "check_for_unexpected_duplicates_or_close_relatives"
  assumption: "Datasets are expected to be composed of unrelated individuals, but this assumption should be checked."
  automatic_sample_exclusion: false

  king:
    tool: "KING"
    estimator: "KING-robust"
    command_mode: "--kinship"
    input_dataset: "stable pre-HWE target QC autosomal biallelic SNP set"
    purpose: "Pairwise relatedness estimation within Cinque Terre."
    ld_pruning: false
    maf_filter: false
    thresholds:
      duplicate_or_MZ_gt: 0.354
      first_degree_min: 0.177
      second_degree_min: 0.0884
      third_degree_min: 0.0442
    notes: "No individual is removed automatically. KING is run before HWE filtering, without MAF filtering or LD pruning. With --kinship, duplicate/first-/second-degree calls are the primary relationship screen; the 0.0442 third-degree threshold is exploratory only."

# ============================================================
# Population structure branch
# ============================================================

population_structure:
  target_dataset: "Cinque Terre"
  european_reference: "1000 Genomes Project Phase 3 EUR"

  pca:
    method: "smartpca"
    maf_threshold: 0.05
    maf_scope: "joint_harmonized_ct_plus_1kg_eur"
    expected_joint_samples: 549
    expected_harmonized_variants: 7548844

    pruning:
      tool: "PLINK2 --indep-pairwise"
      window_snps: 50
      step_snps: 5
      r2_threshold: 0.2
      indep_order: 1

    smartpca:
      n_components: 10
      numoutlieriter: 0
      usenorm: "YES"
      altnormstyle: "NO"
      familynames: "NO"
      fastmode: "NO"
      numchrom: 22

  roh:
    method: "PLINK --homozyg"
    maf_threshold: 0.05
    expected_joint_samples: 549
    expected_joint_maf0.05_variants: 4878327

    production:
      homozyg_window_snp: 50
      homozyg_snp: 50
      homozyg_kb: 1500
      homozyg_density: 50
      homozyg_gap: 500
      homozyg_window_missing: 5
      homozyg_window_het: 1
      homozyg_window_threshold: 0.05
      froh_denominator_bp: 2770000000

# ============================================================
# Selection / LASSI branch
# ============================================================

selection:
  description: "Haplotype-based selection scan focused on Cinque Terre, with CEU, TSI and IBS as the frozen production comparison set."

  primary_focus_dataset: "Cinque Terre"

  scan_design:
    primary_focus: "Cinque Terre"
    comparative_lassi_scans_allowed: true
    notes: "Cinque Terre is the focal discovery population. CEU, TSI and IBS are production comparators; FIN and GBR are LD-context only. A separate CEU paper-oriented LASSI-T benchmark is kept distinct from the production CEU scan."

  external_populations:
    role: "comparative_scan_or_reference_interpretation"
    italian_wgs_reference_cohorts: "under_evaluation"
    onekg_eur_candidate_populations: ["CEU", "TSI", "IBS"]
    final_comparison_set: ["CEU", "TSI", "IBS"]
    roles:
      CEU: "empirical_LASSI_benchmark_and_Northern_European_reference"
      TSI: "Southern_European_proximate_comparator"
      IBS: "Southern_European_proximate_comparator"
    excluded_from_primary_lassi_comparison: ["FIN", "GBR"]
    ld_context_populations: ["CEU", "FIN", "GBR", "IBS", "TSI"]
    ld_context_only_roles:
      FIN: "European_LD_context_only_not_scanned_with_LASSI"
      GBR: "European_LD_context_only_not_scanned_with_LASSI"

  preprocessing:
    maf_threshold: 0.05
    maf_threshold_status: "frozen_for_lassi_marker_panel_and_ld_window_calibration"
    maf_sensitivity_threshold: 0.01
    ld_pruning: false

  ld_decay:
    purpose: "Estimate linkage-disequilibrium decay separately within CT and all five 1000G EUR populations for complete European LD context; translate decay to SNP-delimited LASSI windows only for CT, CEU, TSI and IBS."
    status: "full_eur_ld_context_completed_lassi_windows_frozen"
    target_dataset: "final_QCed_Cinque_Terre_46_samples"
    statistic: "PLINK1.9 unphased hard-call r2"
    rationale: "LASSI's human empirical protocol calibrated SNP-window size from the physical interval over which r2 decayed below one third of its value at 1 kb. The CT audit first estimates that physical distance, separately from the later conversion to SNP count."
    primary_maf_threshold: 0.05
    sensitivity_maf_threshold: 0.01
    maf_sensitivity_rationale: "Common variants provide a stable primary LD-decay calibration in the 46-sample CT cohort; MAF>=0.01 is retained as a prespecified sensitivity so the 0.05 threshold is not accepted solely by convention."
    full_eur_context_observed:
      CEU: {baseline_mean_r2: 0.41264905618283076, first_crossing_kb: 53.5, stable_crossing_kb: 53.5}
      FIN: {baseline_mean_r2: 0.4129174862827422, first_crossing_kb: 55.5, stable_crossing_kb: 58.5}
      GBR: {baseline_mean_r2: 0.423464777295785, first_crossing_kb: 55.5, stable_crossing_kb: 55.5}
      IBS: {baseline_mean_r2: 0.41134044457191504, first_crossing_kb: 53.5, stable_crossing_kb: 53.5}
      TSI: {baseline_mean_r2: 0.40857039026268993, first_crossing_kb: 52.5, stable_crossing_kb: 52.5}
      CT: {baseline_mean_r2: 0.4144855994950274, first_crossing_kb: 55.5, stable_crossing_kb: 57.5}
      interpretation: "Across CT and all five 1000G EUR populations, the selected physical LD-decay scale is tightly clustered between 52.5 and 55.5 kb. FIN has a later five-bin stable crossing at 58.5 kb, but its direct first crossing is still 55.5 kb."
    anchor_sampling:
      method: "deterministic_even_physical_spacing"
      anchors_per_chromosome: 100
      edge_margin_kb: 500
      max_pair_distance_kb: 500
      rationale: "Use a physically distributed anchor subset to avoid an infeasible all-pairs calculation on WGS-density data while retaining genome-wide representation. Every anchor is compared with all eligible nearby SNPs."
    bin_width_kb: 1
    baseline_distance_kb: 1
    baseline_half_width_kb: 0.5
    decay_fraction: 0.3333333333
    crossing_definition: "first 1-kb distance bin beyond the baseline interval whose mean r2 is below one third of the mean r2 for pairs separated by 0.5-1.5 kb"
    stability_diagnostic_consecutive_bins: 5
    observed_audit:
      maf0.05:
        total_valid_ld_pairs: 4033512
        baseline_pair_count: 7603
        baseline_mean_r2: 0.4144855994950274
        one_third_threshold_r2: 0.13816186648452627
        first_crossing_kb: 55.5
        stable_5bin_crossing_kb: 57.5
      maf0.01_sensitivity:
        total_valid_ld_pairs: 7272074
        baseline_pair_count: 14365
        baseline_mean_r2: 0.186481064711031
        one_third_threshold_r2: 0.06216035489746097
        first_crossing_kb: 63.5
        stable_5bin_crossing_kb: 67.5
      interpretation: "The lower-MAF sensitivity shifts the absolute crossing modestly but leaves the physical LD scale in the same tens-of-kb range. Because the LASSI marker panel is MAF>=0.05, its LD decay is the primary calibration."
    derived_parameters:
      selected_physical_decay_kb: 55.5
      selected_physical_decay_definition: "first 1-kb bin below one third of the 0.5-1.5-kb baseline mean r2"
      stable_diagnostic_kb: 57.5
      physical_decay_kb_maf0.05: 55.5
      physical_decay_kb_maf0.01: 63.5
      lassi_window_snps: null
      lassi_shift_snps: null
      shift_fraction_of_window: 0.10
    next_decision: "Full MAF>=0.05 LD context is complete for CT plus all five 1000G EUR populations. Proceed to CT phasing and LASSI input preparation; FIN and GBR remain LD-context-only populations unless the scan design changes."

  phasing:
    method: "SHAPEIT2"
    software_version_target: "v2.r904"
    status: "production_phasing_completed_post_phasing_audit_pass"
    purpose: "Phase the 46 Cinque Terre individuals for haplotype-based LASSI using the phased 1000 Genomes EUR reference panel; CEU, TSI and IBS already use published phased 1000G haplotypes."
    rationale: "SHAPEIT2 explicitly documents reference-assisted phasing as particularly useful for study datasets with fewer than 100 individuals. The CT cohort contains 46 individuals."
    marker_panel:
      target_population: "CT"
      maf_threshold: 0.05
      variant_type: "biallelic SNPs"
      rationale: "Phase the same common-variant panel used for the production CT LASSI scan."
    reference_support:
      selected_scope: "1000_Genomes_Phase3_EUR_via_include_grp"
      reference_samples: 503
      required_format: "1000 Genomes Phase 3 SHAPEIT2/IMPUTE2 HAP + LEGEND + SAMPLE (full 2503-sample panel), restricted internally to EUR with --include-grp"
      alignment_check: "SHAPEIT2 -check before phasing"
      caution: "With --input-ref, SHAPEIT2 requires study SNPs to be represented in the reference with compatible alleles; incompatible or study-only sites are excluded after the formal alignment check."
    parameters:
      effective_population_size: 11418
      effective_population_size_rationale: "European/CEU value recommended in SHAPEIT2 documentation."
      window_mb: 0.5
      window_rationale: "Use 0.5 Mb because SHAPEIT2 documentation reports better performance for sequence-derived genotypes than the 2-Mb GWAS default; this setting is also used in Delaneau et al. 2013 (AJHG 93:687-696, doi:10.1016/j.ajhg.2013.09.002) and explicitly retained for sequencing-based reference phasing by Sharp et al. 2016 (Bioinformatics 32:1974-1980, doi:10.1093/bioinformatics/btw065)."
      states: 400
      burn: 7
      prune: 8
      main: 20
      no_mcmc: false
      threads_per_chromosome: 1
      seed: 15052011
      rationale: "Use 400 Hamming-distance-selected conditioning states to privilege phasing accuracy over runtime while retaining the documented SHAPEIT2 default MCMC schedule. The choice is supported by sequencing/reference-based SHAPEIT2 precedent and by the completed chr20 benchmark, which showed practical runtime and <1 GB peak RSS at one thread. One thread per chromosome preserves exact reproducibility; Snakemake parallelizes independent chromosomes."
    benchmark:
      chromosome: 20
      states: 400
      window_mb: 0.5
      threads: 1
      purpose: "Measure runtime and memory for an accuracy-oriented K=400 candidate on chr20 without changing production outputs."
      status: "completed_runtime_and_memory_pass"
      observed_runtime_seconds: 2400
      observed_runtime_minutes: 40
      observed_chr20_snps_phased: 111416
      observed_max_rss_mb: 836.42
      observed_max_uss_mb: 832.88
      observed_max_pss_mb: 833.02
      observed_mean_load_percent: 99.49
      observed_cpu_time_seconds: 2387.10
    genetic_map:
      build: "GRCh37/b37"
      source: "SHAPEIT2-compatible genetic map"
      local_directory_key: "local_paths.shapeit2_b37_map_dir"
      required_for_production_phasing: true
    local_resources:
