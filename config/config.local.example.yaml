# Machine-specific input paths.
# Copy this file to config/config.local.yaml and replace the example paths.
# config/config.local.yaml is intentionally not version-controlled.

local_paths:
  target_vcf: "/absolute/path/to/all_samples_snp.vcf.gz"
  target_vcf_index: "/absolute/path/to/all_samples_snp.vcf.gz.tbi"


  # 1000 Genomes Phase 3 resources used for the EUR reference branch.
  # Set these only in config/config.local.yaml; the real local paths are not
  # version-controlled.
  onekg_phase3_vcf_dir: "/absolute/path/to/phase3_all_vcfs"
  onekg_phase3_sample_metadata: "/absolute/path/to/1000GP_Phase3.sample"


  # SHAPEIT2 v2.r904 resources for CT reference-assisted phasing.
  shapeit2_binary: "/absolute/path/to/shapeit"
  shapeit2_b37_map_dir: "/absolute/path/to/shapeit2_b37_maps"
  # Exact filename template used by the workflow; adapt to the maps already on your machine.
  shapeit2_b37_map_template: "/absolute/path/to/shapeit2_b37_maps/genetic_map_chr{chrom}_combined_b37.txt"
  # Templates must contain {chrom}, e.g. ".../1000GP_EUR.chr{chrom}.haplotypes.gz"
  shapeit2_reference_haps_template: "/absolute/path/to/1000GP_Phase3_chr{chrom}.hap.gz"
  shapeit2_reference_legend_template: "/absolute/path/to/1000GP_Phase3_chr{chrom}.legend.gz"
  shapeit2_reference_sample: "/absolute/path/to/1000GP_Phase3.sample"


  # Maintained implementation of the original LASSI T statistic.
  # Clone szpiech/lassip and pin it to commit a6a9d18c2323330fbf74d5a490f9e9c4ebe41d7c.
  lassip_source_dir: "/absolute/path/to/lassip"
  lassip_binary: "/absolute/path/to/lassip/src/lassip"


  # GRCh37/hg19 CRG 100-mer alignability/mappability track for saltiLASSI.
  crg100_bigwig: "/absolute/path/to/wgEncodeCrgMapabilityAlign100mer.bigWig"
